<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What We Eat in Japan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>What We Eat in Japan</h1>
    <p class="subtitle">Just my personal picks of everyday food in Japan.</p>

    <div class="tabs">
      <button id="tab-family" class="tab active" onclick="switchSection('family')">
        Chain Restaurants
      </button>
      <button id="tab-home" class="tab" onclick="switchSection('home')">
        Home Cooking
      </button>
    </div>

    <div id="category-buttons" class="category-buttons"></div>

    <div id="items" class="items-grid"></div>
  </div>

  <div id="modal" class="modal hidden" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-button" onclick="closeModal()">×</button>
      <div id="modal-detail"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
